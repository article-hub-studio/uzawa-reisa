services:
  - type: worker
    name: uzawa-reisa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NINEROUTER_API_KEY
        sync: false
      - key: NINEROUTER_BASE_URL
        value: https://ninerouterhoang.onrender.com/v1
      - key: NINEROUTER_MODEL
        value: ag/gemini-3.8-flash
      - key: DISCORD_CHANNEL_ID
        value: "1513510869357821962"